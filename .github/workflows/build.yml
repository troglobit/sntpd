name: Bob the Builder

# Run on all branches, including all pull requests, except the 'dev'
# branch since that's where we run Coverity Scan (limited tokens/day)
on:
  push:
    branches:
      - '**'
      - '!dev'
  pull_request:
    branches:
      - '**'

permissions:
  contents: read

jobs:
  build:
    # Verify we can build on latest Ubuntu with both gcc and clang
    name: ${{ matrix.compiler }} ${{ matrix.config }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        compiler: [gcc, clang]
        config: ['', '--enable-debug']
      fail-fast: false
    env:
      MAKEFLAGS: -j3
      CC: ${{ matrix.compiler }}
    steps:
      - name: Install dependencies
        run: |
          sudo apt-get -y update
          sudo apt-get -y install tree
      - uses: actions/checkout@v7
      - name: Configure
        run: |
          ./autogen.sh
          ./configure --prefix= ${{ matrix.config }}
      - name: Build
        run: |
          make V=1
      - name: Enable unprivileged userns (unshare)
        # The integration tests give each case its own network namespace
        # so they can bind port 123 without root.  Ubuntu restricts
        # unprivileged user namespaces by default, and without this the
        # whole suite politely skips itself and the build still passes.
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Check
        run: |
          make check -j$(nproc) || (cat test/test-suite.log; false)
          # A skipped test is not a passing test.  If the runner ever
          # stops allowing namespaces we want to hear about it here,
          # rather than read a green tick over two unit tests.
          grep -qE '^# SKIP: +0$' test/test-suite.log || {
            echo "::error::tests were skipped, see the summary below"
            cat test/test-suite.log
            false
          }
      - name: Install
        run: |
          DESTDIR=~/tmp make install-strip
          tree ~/tmp
          ldd ~/tmp/sbin/sntpd
          size ~/tmp/sbin/sntpd
          ~/tmp/sbin/sntpd -h
  debian:
    # Verify that Debian packages can be built
    name: Debian Package
    runs-on: ubuntu-latest
    container: debian:stable
    steps:
      - uses: actions/checkout@v7
      - name: Installing dependencies
        # systemd.pc lives in systemd-dev nowadays, and debian/rules
        # passes --with-systemd, which configure treats as an error when
        # it cannot query the unit directory.
        run: |
          apt-get update
          apt-get install -y build-essential autoconf automake dpkg-dev debhelper \
                             devscripts libsystemd-dev systemd systemd-dev pkg-config
      - name: Building Debian package
        # No namespaces in here, so the integration tests skip.  That is
        # fine; this job is about the packaging, and the matrix above
        # insists on the tests actually running.
        run: |
          ./autogen.sh
          ./configure
          make distcheck
          make package
